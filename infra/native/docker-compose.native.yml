# The only two containers GoCast runs permanently.
#
# Everything else is a host service: nginx + php-fpm serve Laravel, apt
# packages provide MySQL, Redis and Icecast, and systemd units run the queue
# worker, the scheduler and the Next.js server. See infra/native/README.md.
#
# What cannot be a host service:
#
#   • Per-station Liquidsoap. infra/liquidsoap/Dockerfile pins v2.4.5 and
#     documents why (savonet#4851 crossfade wedge, savonet#5194 crash in
#     source.skip from a harbor.http handler). Ubuntu ships 2.2.x, which
#     cannot even parse the generated .liq. Those containers are spawned by
#     LiquidsoapSupervisor via `docker run`, not declared here — compose
#     cannot scale a service per database row.
#
#     This is the ONLY reason Docker is installed at all.
#
#   • The two services below, which exist to serve those containers.
#
# Run from the repo root:
#     docker compose -f infra/native/docker-compose.native.yml up -d

name: gocast-native

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------- Docker socket proxy ----------
  # Native Laravel needs to run `docker` to manage station containers. The
  # obvious way — adding the php-fpm user to the `docker` group — is
  # root-equivalent on the host: anyone with code execution in PHP could
  # `docker run -v /:/host` and read or rewrite the entire filesystem,
  # /etc/shadow included.
  #
  # Read the caveat in LiquidsoapSupervisor's class docblock before trusting
  # this too far: the proxy filters by API path and method, never by request
  # body, and this app needs CONTAINERS + POST — which is `/containers/create`
  # with an arbitrary HostConfig. It keeps the gocast user off the raw socket;
  # it does not contain code execution.
  #
  # Point Laravel at it with DOCKER_HOST=tcp://127.0.0.1:2375. Published on
  # loopback only — an unauthenticated Docker API on a public interface is
  # the fastest way to lose a box.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: gocast-docker-proxy
    environment:
      # Exactly what LiquidsoapSupervisor calls: run, start, stop, rm,
      # inspect, ps, logs.
      CONTAINERS: 1
      # Required for `docker run --network gocast-network`.
      NETWORKS: 1
      # Read-only image list/inspect. No build, pull or push.
      IMAGES: 1
      # Allows the POST verbs above; without it the API is read-only and
      # every station start fails with a 403 from the proxy.
      POST: 1
      # Stays denied. The supervisor's telnet() opens a plain TCP socket to
      # the container rather than shelling out to `docker exec`, precisely
      # so this can remain 0 — the proxy cannot scope exec by container
      # name, so enabling it would hand a compromised PHP a shell in every
      # container on the network.
      EXEC: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/_ping"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ---------- Station router ----------
  # Resolves gocast-liquidsoap-{slug} for host nginx. See
  # station-router/nginx.conf for the full rationale.
  station-router:
    # Built rather than pulled: the njs module the ingest routing needs is not
    # in the stock image. The config files are still mounted, so only a module
    # bump is a rebuild.
    build:
      context: ./station-router
    image: gocast/station-router:1.29.8
    container_name: gocast-station-router
    volumes:
      - ./station-router/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./station-router/ingest.js:/etc/nginx/ingest.js:ro
    ports:
      # Host nginx forwards /broadcast/{slug} here for the browser studio.
      # Loopback only — it is reached through the TLS vhost, never directly.
      - "127.0.0.1:8091:8091"
      # External encoder ingest. ALL INTERFACES, deliberately and unlike every
      # other port in this file: a DJ's copy of BUTT is out on the internet and
      # has to open a plain TCP connection to it. Harbor authenticates every
      # connection (HarborAuthController); nothing else does.
      #
      # The host port is configurable because 8000 — the conventional Icecast
      # source port, and what every encoder defaults to — is already taken on
      # this box by ICECAST_PORT, and by `php artisan serve` in local
      # development. The CONTAINER side is always 8000, so ingest.js and
      # nginx.conf never have to know.
      #
      # DOCKER PUBLISHES THIS IN FRONT OF ufw. Its rules land in the DOCKER
      # chain, which the INPUT chain ufw manages never sees, so this port is
      # reachable whether or not `ufw status` suggests otherwise. Closing it
      # means not publishing it.
      - "${INGEST_PORT:-8010}:8000"
    networks:
      - default
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          # Raised from 64M: splicing TCP is nearly free, but njs brings a
          # JavaScript VM per worker along with it.
          memory: 128M

networks:
  # Must be the SAME network the per-station containers join —
  # LiquidsoapSupervisor hardcodes `gocast-network` as a class constant.
  #
  # The CIDRs are literals, not config. They are a constant of the system:
  # a /16 is 65534 addresses, which is more stations than this will ever
  # run, and it is private space that collides with nothing. Making them
  # tunable bought nothing and cost a required --env-file on every compose
  # invocation.
  #
  # THIS FILE IS THE SOURCE OF TRUTH for the block. The other two places it
  # appears both derive from here rather than restating it:
  #   • the ufw rules in setup-native.sh read the live network back with
  #     `docker network inspect`, so they cannot drift from what Docker did.
  #   • api/config/liquidsoap.php defaults container_subnet to the same
  #     /16. If you ever change the subnet here, change it there too —
  #     that one is a genuine second copy, because PHP computes station
  #     addresses from it without ever asking Docker.
  #
  # subnet is pinned so the ufw rules can name a stable CIDR instead of a
  # `br-<netid>` interface whose name changes every time the network is
  # recreated.
  #
  # ip_range is load-bearing, not tidiness. Station containers are started
  # with an explicit --ip derived from the station's container_index,
  # counting up from the bottom of the subnet. Docker's IPAM knows nothing
  # about that and, left alone, allocates from the bottom too — so the
  # router would sit exactly where a station is about to land, and some
  # later station start would fail with "address already in use". Confining
  # IPAM to the last /24 keeps them apart: everything auto-assigned lives at
  # the top, every station at the bottom.
  #
  # NOTE: `docker compose down` will try to remove this network. With any
  # station container attached the removal fails harmlessly ("has active
  # endpoints") and the network survives. With every station off air it IS
  # removed — and recreated identically on the next `up`, because the block
  # is pinned here rather than left to Docker's default pool.
  default:
    name: gocast-network
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          ip_range: 172.28.255.0/24
