# Catch-all for any Host / SNI that no vhost claims.
#
# Without it nginx answers an unknown hostname with the FIRST server block
# loaded for that port — on the production box that was another site's
# (api.theelitesyria.com), so a scanner hitting the bare origin IP got a real
# certificate and a real application back. Found in the 2026-10-27 review.
#
# :80   closes the connection without a response (444).
# :443  refuses the TLS handshake outright, before any certificate is sent,
#       so the origin does not even reveal which names it holds certificates
#       for. ssl_reject_handshake needs nginx 1.19.4+ (Ubuntu 24.04 ships 1.24).
#
# `default_server` may appear only once per address:port. If `nginx -t`
# reports "a duplicate default server", another vhost already claims it:
# remove `default_server` from that one, so unknown names land here.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
    access_log off;
}
