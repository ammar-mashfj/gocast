# Public app — reverse proxy to the Next.js standalone server.
#
# `output: "standalone"` (client/next.config.ts) emits a plain node server;
# gocast-client.service runs it on 127.0.0.1:__CLIENT_PORT__ and this vhost
# fronts it. Next serves its own /_next/static with correct immutable
# caching, so there is deliberately no `root` here — proxy everything and
# let the framework decide.

upstream gocast_client {
    server 127.0.0.1:__CLIENT_PORT__;
    keepalive 32;
}

# www -> apex. DNS resolves www.__APP_HOST__ and the certificate covers it, so
# without a block of its own it falls through to whichever vhost nginx loaded
# first -- which, with the stock `default` removed, is simply the alphabetically
# first file in sites-enabled. That is a neighbouring site, not a 404.
server {
    listen 80;
    listen [::]:80;
    server_name www.__APP_HOST__;

    return 301 https://__APP_HOST__$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name __APP_HOST__;

    access_log /var/log/nginx/gocast-app.access.log;
    error_log  /var/log/nginx/gocast-app.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The studio uploads files to the API, not here, but keep a sane
    # ceiling so a stray POST fails fast instead of buffering to disk.
    client_max_body_size 12M;

    location / {
        proxy_pass http://gocast_client;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Keepalive to the upstream needs Connection cleared, not "upgrade".
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
    }
}
