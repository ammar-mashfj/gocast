# Laravel API — replaces the FrankenPHP/Caddy `api` service.
#
# Two server blocks, same docroot, very different exposure:
#
#   1. __API_HOST__ on :80/:443 — the public API the browser talks to.
#   2. :__INTERNAL_API_PORT__   — the SAME app, reachable only from the
#      Docker bridges. Per-station Liquidsoap containers POST their
#      harbor-auth / now-playing / station-event callbacks here
#      (LIQUIDSOAP_API_URL). Keeping it off the public vhost means those
#      calls never leave the box and never pay for TLS.
#
# Install to /etc/nginx/sites-available/gocast-api.conf and symlink into
# sites-enabled. Run certbot --nginx AFTER installing: it rewrites this
# file in place to add the :443 block and the http→https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name __API_HOST__;

    root __APP_ROOT__/api/public;
    index index.php;

    charset utf-8;

    # Audio uploads. Must stay >= post_max_size in php/99-gocast.ini
    # (640M) or nginx rejects the body before PHP ever sees it, and the
    # user gets a bare 413 with no Laravel validation message.
    client_max_body_size 640M;

    # A 500 MB batch over a slow link takes many minutes. The default 60s
    # read timeout kills those mid-flight.
    client_body_timeout 900s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/gocast-api.access.log;
    error_log  /var/log/nginx/gocast-api.error.log;

    # Laravel's public disk. `php artisan storage:link --relative` makes
    # public/storage a relative symlink into storage/app/public, so nginx
    # serves station artwork straight off disk without touching PHP.
    #
    # --relative matters: an absolute link created inside the old api
    # container points at /app/storage/... which does not exist on the
    # host. If artwork 404s after cutover, that link is why.
    location /storage/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm-gocast.sock;
        fastcgi_param HTTP_PROXY "";

        # Long enough to cover a large upload being moved and analysed.
        # Keep in step with max_execution_time (900s) in php/99-gocast.ini:
        # if nginx gives up first the user sees 504 while PHP keeps working.
        fastcgi_read_timeout 900s;

        # 4K is nginx's default and it is too small here: Sanctum's auth
        # cookie plus a Set-Cookie on a redirect regularly overflows it,
        # which surfaces as an intermittent "upstream sent too big header"
        # 502 that only reproduces for logged-in users.
        fastcgi_buffer_size 16k;
        fastcgi_buffers 8 16k;
    }

    # Never serve dotfiles — .env sitting under a misconfigured docroot is
    # the single most-exploited Laravel misdeploy.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# ---------------------------------------------------------------------------
# Internal callback vhost.
#
# Station containers call this as http://host.docker.internal:__INTERNAL_API_PORT__.
# It is bound on all interfaces because `--add-host host.docker.internal:
# host-gateway` resolves to the docker0 gateway (172.17.0.1), not to
# 127.0.0.1 — a loopback-only listener is unreachable from a container.
#
# Public exposure is closed at the firewall instead: ufw's default-deny
# plus explicit allows from the two Docker CIDRs. setup-native.sh installs
# those rules; if you flush ufw, re-run it or this port goes public.
#
# The routes behind it are already guarded by the `internal` middleware
# (X-Internal-Key must match INTERNAL_API_KEY), so the firewall is the
# second layer, not the only one.
# ---------------------------------------------------------------------------
server {
    listen __INTERNAL_API_PORT__;
    server_name _;

    root __APP_ROOT__/api/public;
    index index.php;

    client_max_body_size 2M;

    access_log /var/log/nginx/gocast-internal.access.log;
    error_log  /var/log/nginx/gocast-internal.error.log;

    # Only the internal API surface. Everything else 404s, so a container
    # that is compromised cannot reach login, uploads or the public API
    # through this door.
    location /api/internal/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location / {
        return 404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm-gocast.sock;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 30s;
    }
}
