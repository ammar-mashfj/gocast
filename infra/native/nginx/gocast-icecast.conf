# Listener-facing Icecast.
#
# Native icecast2 binds __ICECAST_PORT__; this terminates TLS in front of
# it so the player page (served over HTTPS) can attach to the stream
# without mixed-content errors.
#
# Everything here exists because a stream is not a web page:
#
#   proxy_buffering off  — with buffering on, nginx accumulates the MP3
#     before forwarding. Listeners hear nothing for several seconds and
#     then a burst; on a live show that reads as "the stream is broken".
#
#   proxy_read_timeout 24h — an Icecast connection is meant to stay open
#     for the length of the show. The 60s default drops every listener a
#     minute in, which looks like a stability problem in the encoder.
#
#   chunked_transfer_encoding off — Icecast streams an unbounded body with
#     no Content-Length. Re-chunking it confuses a number of hardware
#     players and some mobile browsers.

server {
    listen 80;
    listen [::]:80;
    server_name __ICECAST_HOST__;

    access_log /var/log/nginx/gocast-icecast.access.log;
    error_log  /var/log/nginx/gocast-icecast.error.log;

    # Stock Icecast 2.x does not answer OPTIONS, so a cross-origin preflight
    # fails at the edge. Answer it here and let the browser proceed.
    # (icecast.xml already sets Access-Control-Allow-Origin on real responses.)
    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range, Icy-MetaData";
            add_header Access-Control-Max-Age       86400;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:__ICECAST_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;

        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # The admin API (listener counts, metadata) is polled by Laravel over
    # loopback, never from the internet. Closing it here keeps the Icecast
    # admin password from being brute-forceable from outside.
    location /admin/ {
        deny all;
    }
}
