# Broadcaster ingest + HLS playout.
#
# Two jobs:
#
#   1. /broadcast/{slug}  — the studio's WebSocket, upgraded and forwarded
#      into that station's Liquidsoap harbor input.
#   2. *.m3u8 / segments  — HLS written to /var/gocast/hls/{slug}/ by the
#      station container, served straight off disk.
#
# Why a browser needs this at all: a page loaded over HTTPS may not open a
# ws:// socket, and harbor inside each station container speaks plain ws.
# TLS is terminated once here, so no station container needs a cert, a
# published port, or a DNS name.
#
# ---------------------------------------------------------------------------
# The routing problem, and why /broadcast proxies to a loopback port.
#
# Ingest has to reach `gocast-liquidsoap-{slug}:8090`, and host nginx cannot
# resolve that: Docker's embedded DNS at 127.0.0.11 is reachable only from
# inside a container, and container IPs change on every restart, so there is
# nothing stable to hardcode.
#
# The fix is a ~20-line nginx container that DOES sit on gocast-network
# (infra/native/station-router/), published on 127.0.0.1:__ROUTER_PORT__.
# It resolves the container name per request via 127.0.0.11 and needs no
# reconfiguration when stations are created or destroyed. Host nginx just
# forwards to that fixed port.
#
# The alternative — regenerating an nginx map of slug→published-port every
# time a station starts, and reloading — means changing LiquidsoapSupervisor
# to publish ports, plus a reload on every station lifecycle event. The
# router container costs about 8 MB and no code change.
# ---------------------------------------------------------------------------

# Standard WebSocket upgrade map. `Connection: upgrade` must only be sent
# when the client actually asked for an upgrade; sending it unconditionally
# breaks plain HTTP requests to the same upstream.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __STREAM_HOST__;

    access_log /var/log/nginx/gocast-stream.access.log;
    error_log  /var/log/nginx/gocast-stream.error.log;

    # ---- Broadcaster ingest -------------------------------------------
    #
    # The slug is constrained to Str::slug()'s charset. This is a security
    # boundary, not tidiness: the router turns the captured group into a
    # container hostname, so an unconstrained path would let a crafted URL
    # address an arbitrary host on the Docker network.
    location ~ "^/broadcast/([a-z0-9][a-z0-9-]{0,62})$" {
        proxy_pass http://127.0.0.1:__ROUTER_PORT__;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A broadcast runs for hours and the socket carries a steady stream
        # of binary MP3 frames, so read/send timeouts must exceed any
        # plausible show. They are not idle timeouts in practice — audio is
        # always flowing — but a paused mic must not be treated as dead.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        # Buffering an upload stream adds latency to the live path and can
        # stall harbor's arrival timing. Off in both directions.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---- HLS playout ---------------------------------------------------
    #
    # Liquidsoap writes /var/gocast/hls/{slug}/playlist.m3u8 plus segments.
    # Matched by extension so it cannot collide with /broadcast above, and
    # split manifest-vs-segment because they want opposite caching.
    #
    # Two flat regex locations rather than one nested pair: nginx only
    # permits nested `location` blocks inside a PREFIX location, so nesting
    # a manifest rule inside a regex rule fails to load with
    # "location ... is outside location ...".

    # Manifest — must never be cached. The segment window rolls every
    # couple of seconds, so a cached playlist is a stalled stream.
    location ~* \.m3u8$ {
        root /var/gocast/hls;

        # `always` so the headers survive a 404 too — that is exactly what
        # a player sees during the gap while a station is still starting,
        # and without CORS on the error the browser reports a cryptic
        # network failure instead of a plain 404.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;

        try_files $uri =404;
    }

    # Segments — immutable once written, so let the browser and any CDN in
    # front actually keep them.
    location ~* \.(ts|aac|mp4|m4s)$ {
        root /var/gocast/hls;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        access_log off;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
