# Real client address behind Cloudflare.
#
# Installed to /etc/nginx/conf.d/, so it applies to every vhost in the http
# block. For a request that arrives from one of Cloudflare's edges, nginx
# replaces $remote_addr with CF-Connecting-IP; for anything else — a client
# that found the origin IP and connected directly, or icecast.gocast.fm,
# which is DNS-only — $remote_addr stays the socket peer. A spoofed
# CF-Connecting-IP from a non-Cloudflare address is ignored.
#
# Laravel no longer reads X-Forwarded-For from the internet: the API vhost
# hands PHP $remote_addr, and bootstrap/app.php trusts only loopback.
#
# $from_cloudflare (bottom of this file) is the other half: the gocast.fm,
# api.gocast.fm and stream.gocast.fm vhosts refuse any connection that did not
# come from a Cloudflare edge, so the origin IP — public, because
# icecast.gocast.fm is DNS-only — cannot be used to skip Cloudflare.
#
# Cloudflare publishes these at https://www.cloudflare.com/ips-v4 and
# https://www.cloudflare.com/ips-v6. They change rarely; when they do, an
# edge missing here shows up as Cloudflare addresses in the access logs —
# and, because of $from_cloudflare, as 444s for real visitors. Keep the two
# lists below identical.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

# Keyed on $realip_remote_addr — the socket peer before the rewrite above —
# so a client cannot claim to be Cloudflare with a header.
geo $realip_remote_addr $from_cloudflare {
    default 0;

    # Local tooling (curl on the box, health checks).
    127.0.0.1/32 1;
    ::1/128      1;

    173.245.48.0/20    1;
    103.21.244.0/22    1;
    103.22.200.0/22    1;
    103.31.4.0/22      1;
    141.101.64.0/18    1;
    108.162.192.0/18   1;
    190.93.240.0/20    1;
    188.114.96.0/20    1;
    197.234.240.0/22   1;
    198.41.128.0/17    1;
    162.158.0.0/15     1;
    104.16.0.0/13      1;
    104.24.0.0/14      1;
    172.64.0.0/13      1;
    131.0.72.0/22      1;
    2400:cb00::/32     1;
    2606:4700::/32     1;
    2803:f800::/32     1;
    2405:b500::/32     1;
    2405:8100::/32     1;
    2a06:98c0::/29     1;
    2c0f:f248::/32     1;
}
