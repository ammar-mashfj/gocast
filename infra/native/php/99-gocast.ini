; Drop into BOTH /etc/php/__PHP_VERSION__/fpm/conf.d/ and
; /etc/php/__PHP_VERSION__/cli/conf.d/ — the CLI copy matters because the
; queue worker processes the same uploads the web tier accepted, and a
; smaller memory_limit there fails jobs that succeeded at the HTTP layer.
;
; The upload numbers are lifted verbatim from api/php/uploads.ini, which is
; what the FrankenPHP image used. Keep the two in step.

; Audio uploads: <=300 MB per file, client-side batches up to ~500 MB.
upload_max_filesize = 320M
post_max_size       = 640M
max_file_uploads    = 30
max_input_time      = 900
max_execution_time  = 900
memory_limit        = 512M

; getid3 reads tags from the uploaded file; MP3 artwork extraction is the
; peak allocation in a request that is otherwise cheap.
;
; ---------------------------------------------------------------------------
; OPcache.
; ---------------------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; The one line that differs from the container build, and it differs on
; purpose.
;
; The image set validate_timestamps=0 because an immutable image can only
; change by restarting the container. A native deploy rewrites files under a
; RUNNING php-fpm: with timestamp validation off, `git pull` changes nothing
; until fpm is reloaded, and a half-reloaded state serves old code against a
; new database schema.
;
; deploy-native.sh reloads php-fpm explicitly, so 0 is achievable — but it
; turns "forgot to reload" from a slow deploy into a silent one. 2s
; revalidation costs a stat() per file per 2 seconds and removes the class
; of bug entirely.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Laravel reads doc comments at runtime (attributes, some package
; reflection). Stripping them breaks route model binding in subtle ways.
opcache.save_comments = 1

; Never expose the interpreter version in response headers.
expose_php = Off

; Errors to the log, never to the client.
display_errors = Off
log_errors = On

; The session cookie is set by Laravel, not by PHP's session handler
; (SESSION_DRIVER=database), but harden the defaults anyway.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
