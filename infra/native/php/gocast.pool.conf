; Dedicated php-fpm pool for GoCast.
;
; Install to /etc/php/__PHP_VERSION__/fpm/pool.d/gocast.conf and REMOVE (or
; leave alone, if the box serves other sites) the default www pool. A
; separate pool matters for three reasons: the app runs as its own user, the
; process limits are sized for this workload, and a runaway pool cannot
; starve anything else on the machine.

[gocast]

; Runs as the same user that owns the checkout, /var/gocast and the storage
; tree. Sharing one identity across php-fpm, the queue worker, the scheduler
; and the deploy script is what keeps Laravel's cache and log files writable
; by all of them — mixed ownership here is the classic "works until the
; queue worker writes the log first" failure.
user = __RUN_USER__
group = __RUN_USER__

; Unix socket, not TCP: no loopback stack, no port to accidentally expose.
; Owned by nginx's user so it can connect; mode 0660 so nothing else can.
listen = /run/php/php__PHP_VERSION__-fpm-gocast.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; `dynamic` over `ondemand`: the API is polled continuously (the studio
; polls station status every couple of seconds while a broadcast is live),
; so idle-process churn costs more than the memory the spare children hold.
pm = dynamic
; Sized for a 4 GB box. Each child peaks near the 256M memory_limit in
; 99-gocast.ini during an upload, but sits far below it serving JSON — raise
; this only after watching real RSS, because max_children * memory_limit is
; the worst case that gets the box OOM-killed.
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5

; Recycle children periodically. Not because Laravel leaks, but because a
; long-lived PHP process accumulates fragmented allocations; this bounds it
; without any behavioural effect.
pm.max_requests = 500

; Surface slow requests instead of guessing. Anything past 10s in this app
; is a stuck upload, a hung docker call, or an unindexed query.
slowlog = /var/log/php__PHP_VERSION__-fpm-gocast-slow.log
request_slowlog_timeout = 10s

; Hard stop for a wedged request. Must exceed max_execution_time (300s) or
; fpm kills the worker before PHP can return its own error, and the user
; sees a 502 with nothing in the Laravel log.
request_terminate_timeout = 330s

catch_workers_output = yes
decorate_workers_output = no

; PHP errors go to the fpm log, never to the HTTP response.
php_admin_value[error_log] = /var/log/php__PHP_VERSION__-fpm-gocast.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off

; ---------------------------------------------------------------------------
; Environment for child processes. This block is NOT optional.
;
; php-fpm defaults to clear_env = yes, which hands every worker an EMPTY
; environment. Two things break as a result, and neither is obvious:
;
;  1. LiquidsoapSupervisor shells out to `docker`, and the docker CLI reads
;     DOCKER_HOST from the process environment. Putting DOCKER_HOST in
;     api/.env does NOT set it: `config:cache` (which deploy-native.sh runs)
;     makes Laravel skip loading .env entirely — LoadEnvironmentVariables
;     returns early when the config is cached — so the putenv() that would
;     normally export it never happens. The CLI then falls back to
;     /var/run/docker.sock, which this user deliberately cannot read, and
;     every station start fails with a permission error.
;
;     In compose this was invisible: DOCKER_HOST was a real container env
;     var set by the `environment:` block, so the CLI always saw it.
;
;  2. With an empty environment there is no PATH either, so `docker` cannot
;     even be located.
;
; Keep DOCKER_HOST in api/.env as well — it documents the intent and it is
; what a bare `php artisan` picks up when the config cache is cleared.
; ---------------------------------------------------------------------------
env[DOCKER_HOST] = __DOCKER_HOST__
env[PATH] = /usr/local/bin:/usr/bin:/bin

; Reachable filesystem, enforced by PHP itself. A path traversal or an
; unsafe include cannot escape these roots even if application-level
; validation is bypassed. /var/gocast is here because the supervisor writes
; .liq files and playlist directories into it.
php_admin_value[open_basedir] = __APP_ROOT__/api:/var/gocast:/tmp:/usr/share/php:/dev/urandom
