# Station router — the one piece that has to live inside the Docker network.
#
# Host nginx cannot resolve `gocast-liquidsoap-{slug}`: Docker's embedded DNS
# exists only inside containers, and a station's bridge IP changes on every
# restart so there is nothing stable to hardcode. This container sits on
# gocast-network, resolves the name per request through 127.0.0.11, and is
# published on 127.0.0.1:8091 for host nginx to forward to.
#
# It replaces exactly one line of api/Caddyfile:
#     reverse_proxy gocast-liquidsoap-{re.bslug.1}:8090
#
# Nothing here needs regenerating when a station is created or destroyed —
# that is the whole point of resolving at request time.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8091;

        # Docker's embedded DNS. `valid=10s` is deliberately short: a
        # station that restarts comes back on a new IP, and nginx's default
        # is to cache a resolved name for its full TTL. A stale entry sends
        # the broadcaster's socket to an address nothing is listening on,
        # which surfaces as a 502 that "fixes itself" minutes later.
        #
        # ipv6=off because the network is IPv4-only; without it every
        # lookup pays for a AAAA query that always fails.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # -------------------------------------------------------------------
        # The path rewrite is load-bearing.
        #
        # input.harbor(slug, port=8090) in the station template registers its
        # mount at `/{slug}`. The public URL is `/broadcast/{slug}`, so the
        # prefix MUST be dropped before the request reaches harbor or the
        # WebSocket upgrade is refused and the studio reports "could not
        # reach the stream server".
        #
        # Putting `/$slug` after the upstream in proxy_pass replaces the
        # request URI outright, which does the strip in the same directive.
        #
        # NOTE: api/Caddyfile does NOT do this — `handle` preserves the
        # matched path (only `handle_path` strips it), so the Caddy path
        # forwards `/broadcast/{slug}` verbatim. If the containerised
        # deployment ever worked, harbor is more lenient than its docs
        # suggest; if it was never exercised, that is the bug. Either way
        # `/{slug}` is what harbor actually registered, so this is correct.
        # -------------------------------------------------------------------
        location ~ "^/broadcast/(?<slug>[a-z0-9][a-z0-9-]{0,62})$" {
            # Assigning to a variable keeps the container name out of
            # proxy_pass's parse-time host resolution, which is what forces
            # the runtime lookup through the resolver above.
            set $upstream "gocast-liquidsoap-$slug:8090";

            proxy_pass http://$upstream/$slug;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Harbor's auth callback and Laravel's rate limiting both want
            # the broadcaster's real address, not the router's.
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 24h;
            proxy_send_timeout 24h;

            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Liveness for `docker inspect --format '{{.State.Health.Status}}'`.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }
}
