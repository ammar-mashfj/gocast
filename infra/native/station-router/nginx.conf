# Station router — the one piece that has to live inside the Docker network.
#
# Host nginx cannot resolve `gocast-liquidsoap-{slug}`: Docker's embedded DNS
# exists only inside containers, and a station's bridge IP changes on every
# restart so there is nothing stable to hardcode. This container sits on
# gocast-network, resolves the name per request through 127.0.0.11, and is
# published on 127.0.0.1:8091 for host nginx to forward to.
#
# It replaces exactly one line of api/Caddyfile:
#     reverse_proxy gocast-liquidsoap-{re.bslug.1}:8090
#
# Nothing here needs regenerating when a station is created or destroyed —
# that is the whole point of resolving at request time.

# It now does one more thing, and that one is not a proxy detail: external
# encoders (BUTT, Mixxx, RadioDJ) cannot be routed by the http block at all,
# because `SOURCE /mount HTTP/1.0` is not framable HTTP. They are routed at the
# TCP layer by the `stream` block at the bottom of this file. See ingest.js.

# njs, in both flavours. They are separate modules with separate VMs: the
# stream one routes encoder connections at the TCP layer, the http one rewrites
# metadata updates into the shape harbor parses. load_module must come before
# any block, and both are installed by this directory's Dockerfile — this
# config no longer runs against a stock nginx:alpine.
load_module modules/ngx_stream_js_module.so;
load_module modules/ngx_http_js_module.so;

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # The same script the stream block imports. nginx keeps the http and
    # stream njs VMs entirely separate, so this is a second instance of the
    # module rather than a shared one — which is why the file exports two
    # unrelated entry points instead of sharing state between them.
    js_import ingest from /etc/nginx/ingest.js;

    js_var $meta_upstream;
    js_var $meta_args;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8091;

        # Docker's embedded DNS. `valid=10s` is deliberately short: a
        # station that restarts comes back on a new IP, and nginx's default
        # is to cache a resolved name for its full TTL. A stale entry sends
        # the broadcaster's socket to an address nothing is listening on,
        # which surfaces as a 502 that "fixes itself" minutes later.
        #
        # ipv6=off because the network is IPv4-only; without it every
        # lookup pays for a AAAA query that always fails.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # -------------------------------------------------------------------
        # The path rewrite is load-bearing.
        #
        # input.harbor(slug, port=8090) in the station template registers its
        # mount at `/{slug}`. The public URL is `/broadcast/{slug}`, so the
        # prefix MUST be dropped before the request reaches harbor or the
        # WebSocket upgrade is refused and the studio reports "could not
        # reach the stream server".
        #
        # Putting `/$slug` after the upstream in proxy_pass replaces the
        # request URI outright, which does the strip in the same directive.
        #
        # NOTE: api/Caddyfile does NOT do this — `handle` preserves the
        # matched path (only `handle_path` strips it), so the Caddy path
        # forwards `/broadcast/{slug}` verbatim. If the containerised
        # deployment ever worked, harbor is more lenient than its docs
        # suggest; if it was never exercised, that is the bug. Either way
        # `/{slug}` is what harbor actually registered, so this is correct.
        # -------------------------------------------------------------------
        location ~ "^/broadcast/(?<slug>[a-z0-9][a-z0-9-]{0,62})$" {
            # Assigning to a variable keeps the container name out of
            # proxy_pass's parse-time host resolution, which is what forces
            # the runtime lookup through the resolver above.
            set $upstream "gocast-liquidsoap-$slug:8090";

            proxy_pass http://$upstream/$slug;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Harbor's auth callback and Laravel's rate limiting both want
            # the broadcaster's real address, not the router's.
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 24h;
            proxy_send_timeout 24h;

            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Liveness for `docker inspect --format '{{.State.Health.Status}}'`.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }

    # -----------------------------------------------------------------------
    # The OPTIONS responder for encoder ingest.
    #
    # libshout opens every broadcast with `OPTIONS * HTTP/1.1` on its own
    # connection, to find out whether the server will accept `PUT`. That probe
    # names no mount, so the stream block below cannot route it to a station —
    # and closing it is not a neutral act: libshout treats a reset on the probe
    # as fatal for the entire connect and never sends the SOURCE request at
    # all. Verified against libshout 2.4.1 on 2026-09-15:
    #
    #     shout_open() failed: err=Socket error
    #
    # So this answers it instead. Loopback only — it is reached by
    # proxy_pass from the stream block in this same container, never from
    # outside.
    #
    # THE `Allow:` HEADER DELIBERATELY OMITS PUT. Harbor accepts PUT, but
    # SOURCE is the shape that is verified end to end, and PUT would bring
    # HTTP/1.1 chunked framing into a connection we are splicing blind.
    # Advertising no PUT keeps every libshout client on the one tested path.
    # -----------------------------------------------------------------------
    server {
        listen 127.0.0.1:8092;
        access_log off;

        # `OPTIONS * HTTP/1.1` uses the asterisk-form request target. nginx
        # does not accept `*` as a URI and answers 400 before any location is
        # chosen, so the real handler is the error_page below; the location is
        # here for the ordinary-URI case and to give error_page somewhere to
        # land.
        #
        # A NAMED location (@probe) cannot be used here. The redirect happens
        # while nginx is still reading the request line, so there is no URI to
        # carry into it and nginx refuses with a 500:
        #
        #     empty URI in redirect to named location "@probe"
        location = /probe {
            add_header Allow "GET, POST, HEAD, OPTIONS" always;
            return 200 "";
        }

        location / {
            add_header Allow "GET, POST, HEAD, OPTIONS" always;
            return 200 "";
        }

        error_page 400 =200 /probe;
    }

    # -----------------------------------------------------------------------
    # The metadata rewriter for encoder ingest.
    #
    # libshout sends track titles as:
    #
    #     POST /admin/metadata HTTP/1.1
    #     Content-Type: application/x-www-form-urlencoded
    #
    #     mode=updinfo&charset=UTF-8&mount=%2fslug&song=Artist%20-%20Title
    #
    # and harbor reads `mode`, `mount` and `song` from the QUERY ARGS only. It
    # never looks at a form body, so libshout's own request comes back
    #
    #     HTTP/1.0 400 Bad Request ... unrecognised command
    #
    # from a stock harbor, and every BUTT and Mixxx broadcast plays under
    # whatever title happened to be up when it connected.
    #
    # So the stream block sends these here instead of straight to harbor. This
    # is an ordinary HTTP server: nginx parses the request properly, njs reads
    # the body and picks the station, and proxy_pass reissues it as the GET
    # harbor understands.
    #
    # Loopback only — reached by proxy_pass from the stream block in this same
    # container, never from outside.
    # -----------------------------------------------------------------------
    server {
        listen 127.0.0.1:8093;

        resolver 127.0.0.11 valid=10s ipv6=off;

        # A metadata update is a few hundred bytes. Anything larger is not one,
        # and buffering it would be the cheapest denial of service on the box.
        client_max_body_size 4k;
        client_body_buffer_size 4k;

        location = /admin/metadata {
            js_content ingest.metadata;
        }

        location @harbor_metadata {
            # GET, because that is the only shape harbor parses. The body has
            # already been turned into the query string by ingest.metadata, so
            # sending it again would be sending it twice.
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Content-Type "";

            # HARBOR AUTHENTICATES THIS REQUEST TOO, and it must: the ingest
            # port is open to the internet, and without this header anyone
            # could write now-playing text onto any station. Forwarded
            # explicitly because proxy_set_header above resets the header set.
            proxy_set_header Authorization $http_authorization;

            proxy_pass http://$meta_upstream/admin/metadata?$meta_args;
        }

        location / {
            return 404;
        }
    }
}

# ---------------------------------------------------------------------------
# External encoder ingest (Icecast source protocol)
# ---------------------------------------------------------------------------
#
# A raw TCP front door for anything speaking the Icecast 2 source protocol.
# Published on the host (unlike :8091 above, which is loopback-only) because
# the whole point is that a DJ's encoder, out on the internet, can reach it.
#
# This block does NOT authenticate anyone. It reads the first line, works out
# which station the connection is for, and splices. Harbor inside that
# station's container is what checks the credential — the same callback the
# browser studio goes through (HarborAuthController), which is why a plan
# downgrade closes this door too.
stream {
    js_import ingest from /etc/nginx/ingest.js;

    # Declared here so ingest.route may assign to it. njs cannot write to a
    # variable nginx does not know about, and the failure is silent: the
    # assignment throws, the handler never calls s.done(), and the connection
    # hangs until preread_timeout.
    js_var $station_upstream;

    # Same Docker DNS and the same short TTL as the http block above, for the
    # same reason: a station that restarts comes back on a new IP, and a stale
    # entry sends a broadcaster's socket somewhere nothing is listening.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # An unauthenticated port on the public internet: cap concurrent
    # connections per address so a single host cannot park every worker
    # connection in preread.
    #
    # The number has to clear the real libshout flow, which is chattier than
    # "one audio connection" suggests — this file's own capture shows six TCP
    # connections per broadcast (two OPTIONS probes, two SOURCE, two metadata
    # POSTs). One DJ sits at roughly two concurrent, but two encoders behind
    # one NAT — a shared studio, a venue, a campus station — reach four during
    # a track change, and a refused OPTIONS probe is fatal to the ENTIRE
    # connect, not just that request (see ingest.js). That failure surfaces as
    # an intermittent "shout_open() failed: err=Socket error", which reads
    # exactly like a bad stream key and is why this is not tuned any tighter.
    limit_conn_zone $binary_remote_addr zone=ingest_per_ip:1m;

    # $station_upstream is the whole point: a refused connection logs an empty
    # one, so "which station did this belong to" and "did it belong to any" are
    # the same field. $bytes_received distinguishes a broadcast from a probe.
    log_format ingest '$remote_addr -> $station_upstream '
                      'status=$status bytes_in=$bytes_received bytes_out=$bytes_sent '
                      'duration=$session_time';
    access_log /dev/stdout ingest;
    error_log  /dev/stderr warn;

    # THE BROADCASTER'S REAL IP DOES NOT SURVIVE THIS HOP, unlike the studio's
    # at /broadcast/{slug} above, which gets X-Real-IP set explicitly. There is
    # nowhere to put it here: harbor is reading the Icecast source protocol off
    # the raw socket, so `proxy_protocol on` would prepend a PROXY line into the
    # first thing it parses and break every connection. Harbor therefore reports
    # this container's bridge address to the auth callback for every encoder,
    # and HarborAuthController's refusal log says so.
    #
    # The address is not lost, only moved: $remote_addr is correct in the
    # `ingest` access_log above, which is where to go when an incident needs it.
    server {
        listen 8000;

        limit_conn ingest_per_ip 10;

        # The request line is well under 1k; 4k leaves room for a client that
        # sends its whole header block in one segment.
        preread_buffer_size 4k;

        # A client that connects and says nothing gets five seconds. This is
        # also the ceiling on how long a malformed connection can hold a
        # worker slot.
        preread_timeout 5s;

        js_preread ingest.route;

        proxy_pass $station_upstream;

        # A broadcast is one connection for its entire duration. The default
        # 10m would cut a quiet-but-live show off mid-sentence; harbor's own
        # `timeout` (LIQUIDSOAP_HARBOR_INPUT_TIMEOUT) is the thing that decides
        # when a stalled source is gone, and it must be the only thing.
        proxy_timeout 24h;
    }
}
