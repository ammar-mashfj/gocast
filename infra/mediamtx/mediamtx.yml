# MediaMTX — WebRTC/RTMP/SRT ingest for GoCast.
#
# Browsers publish via WHIP at :8889; OBS/etc. via RTMP at :1935; pro setups
# via SRT at :8890. Liquidsoap pulls the resulting audio over RTSP at :8554.
#
# Auth is enforced by Laravel — every publish attempt triggers a webhook
# call to /api/internal/whip-auth which validates the broadcaster's token
# against the station they claim. Without the webhook, anyone can publish
# to any path.
#
# We use `localhost` (not host.docker.internal) for those callbacks because
# this service runs with `network_mode: host` so the container shares the
# host's loopback. host.docker.internal is a bridge-network helper and
# doesn't resolve here.

# info logs every RTSP poll — Liquidsoap probes its station path every ~2s,
# which is two log lines per station per probe. warn keeps the meaningful
# events (publish established/lost, auth failures) without the chatter.
logLevel: warn

# --- Control API ---
# Read-only in practice: paths are a static catch-all (see `paths` below), so
# nothing here creates or removes them at runtime. Kept enabled because the
# healthcheck in docker-compose.yml polls /v3/paths/list and it's the fastest
# way to see who's publishing. Bound to localhost only — never expose it.
api: yes
apiAddress: 127.0.0.1:9997

# --- RTSP — Liquidsoap reads from here ---
rtsp: yes
rtspAddress: :8554
protocols: [tcp, udp]

# --- WHIP/WHEP — browsers publish via WebRTC ---
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigin: '*'
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: yes
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# --- RTMP — OBS, vMix, StreamLabs ---
rtmp: yes
rtmpAddress: :1935

# --- HLS not needed here — Liquidsoap produces HLS, not MediaMTX ---
hls: no

# --- SRT — pro broadcast software ---
srt: yes
srtAddress: :8890

# --- Auth via Laravel webhook ---
# MediaMTX POSTs publish/read attempts to authHTTPAddress with a JSON body
# (user, password, ip, action, path, protocol, id, query). Laravel responds
# 20x to allow, anything else to deny.
#
# Set entirely via the MTX_AUTHHTTPADDRESS env var in docker-compose.yml (dev
# override flips host:port to the dev API on :8000). The YAML key is omitted
# on purpose: MediaMTX ignores MTX_* env overrides when the key is present in
# the config file, so leaving it here would silently break the dev override.
# We deliberately do not embed a secret in the URL — MediaMTX cannot add
# custom headers to auth calls, so /whip-auth is protected by the
# per-publisher token in the WHIP URL's ?token= query.
authMethod: http
# Exclude the control API itself from auth — only localhost can hit it
# (apiAddress is bound to 127.0.0.1) so this is safe.
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

# --- Paths ---
# Liquidsoap pulls RTSP from "{slug}/live" for every station; broadcasters
# publish via WHIP to the same path. Rather than defining one entry per
# station (would require restart on every station create), we declare a
# single catch-all that accepts any path with publisher-pushed source.
#
# Auth on publish is handled by authHTTPAddress above — a publisher with
# a bad token gets rejected before the path becomes ready.
#
# runOnReady fires when a publisher connects and the path goes live;
# runOnNotReady when it disconnects. Both are shell commands, not native
# webhooks, so we use curl to call Laravel.
pathDefaults:
  source: publisher
  # MediaMTX runs these as shell commands (Alpine sh) and substitutes the
  # MTX_-prefixed placeholders ($MTX_PATH, $MTX_QUERY, ...) before exec. We
  # use that substitution for the path, then let the shell expand
  # $INTERNAL_API_URL / $INTERNAL_API_KEY from the container env so:
  #   • dev vs prod ports come from compose env (override.yml swaps them)
  #   • the X-Internal-Key header is a shared secret known only to Laravel
  #     and the MediaMTX container, so Internet attackers can't flip live
  #     state by POSTing to /api/internal/whip-ready directly.
  # Busybox wget — exits 0 on HTTP errors so we don't kill publishers on a
  # transient API hiccup; failures land in the Laravel log only.
  runOnReady: >
    sh -c 'wget -q -O- --post-data="{\"path\":\"$MTX_PATH\"}"
    --header="Content-Type: application/json"
    --header="X-Internal-Key: $INTERNAL_API_KEY"
    "$INTERNAL_API_URL/api/internal/whip-ready"'
  runOnNotReady: >
    sh -c 'wget -q -O- --post-data="{\"path\":\"$MTX_PATH\"}"
    --header="Content-Type: application/json"
    --header="X-Internal-Key: $INTERNAL_API_KEY"
    "$INTERNAL_API_URL/api/internal/whip-not-ready"'

paths:
  all_others:
