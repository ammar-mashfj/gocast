# GoCast production compose. One file, one source of truth.
#
# Dev workflow:
#   docker-compose.override.yml is auto-loaded — adds bind mounts + dev ports.
#
# Prod workflow:
#   Run with `--env-file .env` (compose auto-loads .env at the repo root).
#   ./deploy.sh wraps this.
#
# What's NOT here:
#   • MySQL — install on the host. Containerized DBs add I/O overhead, volume
#     corruption anxiety, and complicate backups. Host install:
#         apt install mysql-server-8.0 && mysql_secure_installation
#         CREATE DATABASE gocast; CREATE USER 'gocast'@'%' IDENTIFIED BY '...';
#         GRANT ALL ON gocast.* TO 'gocast'@'%';
#     Containers reach it via `host.docker.internal` (extra_hosts below).
#
#   • Per-station Liquidsoap containers — spawned by App\Services\
#     LiquidsoapSupervisor (via the docker-proxy below) as stations are
#     created and torn down, not declared here. Compose can't scale a service
#     per DB row; `docker run` on demand can. `stations:relaunch` and
#     `stations:reconcile` (both run by deploy.sh) keep the set in sync.
#
#   • Bootstrap migrations — moved into deploy.sh. One less compose service.

name: gocast

# ---------------------------------------------------------------------------
# Shared log rotation policy.
#
# Docker's default json-file driver keeps container logs FOREVER — no size
# cap, no rotation. On a long-running VPS that is the most common way the box
# dies: /var/lib/docker/containers fills the disk, MySQL can no longer write,
# and everything fails at once with nothing in the logs saying "disk full".
#
# 10 MB × 3 files = 30 MB ceiling per container, ~240 MB for the whole stack.
# Per-station Liquidsoap containers are NOT covered by this (they're spawned
# by `docker run`, outside compose) — LiquidsoapSupervisor passes the same
# --log-opt values itself.
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# ---------------------------------------------------------------------------
# Memory limits — sizing rationale.
#
# These are CEILINGS to stop one runaway process from taking the host down,
# not reservations: unused headroom costs nothing. They are set generously on
# purpose. A limit set too tight is worse than no limit at all — the kernel
# SIGKILLs the process before it can log anything, and `restart: unless-stopped`
# turns that into a crash loop that thrashes the box. (That is exactly what the
# 256m per-station Liquidsoap cap did on 2026-08-13: killed at boot, empty
# logs, machine bogged down.)
#
# Measured steady state on 2026-08-14, for reference when tuning:
#   api 83M · queue 52M · scheduler 52M · redis 4M
#   icecast 2M · mediamtx 4.4M · docker-proxy 4.7M
# Limits below are roughly 5–10× those, which absorbs a legitimate spike
# (opcache is configured for 256M alone in the prod api) while still bounding
# a leak. The `client` figure is deliberately not listed: `next dev` sits at
# ~1.5G in development, while the prod target runs the far smaller standalone
# server — see the dev override for the development ceiling.
#
# No CPU limits: contention degrades gracefully under Docker's fair-share
# scheduler, whereas memory exhaustion kills. Adding cpu caps here would risk
# throttling legitimate traffic spikes for no safety gain.
# ---------------------------------------------------------------------------

services:
  # ---------- Docker socket proxy ----------
  # Sits in front of the raw /var/run/docker.sock and exposes a tcp endpoint
  # that whitelists only the Docker API endpoints LiquidsoapSupervisor uses.
  #
  # Why this matters: without the proxy, the api container mounts the
  # daemon socket directly — that's effectively root-on-host. An attacker
  # who gains code execution in the api can mount the host root (`-v /:/h`),
  # spawn a privileged container, or read every container's filesystem.
  # The proxy reduces that to "can manage gocast-liquidsoap-* containers
  # only" — much smaller blast radius.
  #
  # Allowlist (everything else returns 403 to the api):
  #   CONTAINERS=1  — list, inspect, create, start, stop, remove
  #   NETWORKS=1    — required so `docker run --network gocast-network` works
  #   IMAGES=1      — read-only list/inspect (no build/pull/push)
  #   POST=1        — allow the POST verbs above; without it the API is read-only
  # Everything else (EXEC, VOLUMES, SWARM, BUILD, SYSTEM, ...) stays at the
  # default 0 — denied.
  docker-proxy:
    # v0.5.0 (Alpine 3.24, HAProxy 3.4). Was 0.3.0, which is built on Alpine
    # 3.16 — end-of-life since May 2024 and no longer receiving security
    # patches. That matters more here than anywhere else in the stack: this
    # is the one container holding the Docker socket.
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: gocast-docker-proxy
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      IMAGES: 1
      POST: 1
      # EXEC stays denied. It used to be on because
      # LiquidsoapSupervisor::telnet shelled out to `docker exec` — but the
      # proxy can't filter exec by container name, so that handed an RCE'd
      # api a shell in every container on gocast-network. telnet now opens a
      # plain TCP socket to the container's Liquidsoap telnet port instead,
      # which needs no Docker API access at all.
      EXEC: 0
    volumes:
      # Read-only mount of the host daemon socket. The proxy is the only
      # container that ever sees the raw socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    # Bind the proxy's listener to a stable container name on the gocast
    # network so the api can reach it via `tcp://docker-proxy:2375`.
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/_ping"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ---------- Cache + queue backend ----------
  redis:
    image: redis:7.4-alpine
    container_name: gocast-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          # Deliberately no `maxmemory`/eviction policy on Redis itself:
          # this instance backs sessions AND the job queue, so an LRU policy
          # would silently evict queued jobs. The container ceiling is the
          # backstop instead; the real working set is single-digit MB.
          memory: 512M

  # ---------- Listener-facing audio ----------
  icecast:
    build: ./infra/icecast
    container_name: gocast-icecast
    ports:
      # Host 8888 → container 8000. Cloudflare origin rule terminates HTTPS
      # at the edge for icecast.gocast.fm and forwards to host:8888.
      - "8888:8000"
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?required}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD:?required}
      ICECAST_ADMIN_USER: ${ICECAST_ADMIN_USER:-admin}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?required}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/status-json.xsl"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          # <clients>500</clients> in icecast.xml.tpl; each listener costs a
          # small connection buffer, so this scales with the listener cap.
          memory: 512M

  # ---------- WebRTC ingest (WHIP/RTMP/SRT) ----------
  # Browsers publish via WHIP; OBS via RTMP; pro setups via SRT. Liquidsoap
  # pulls the resulting stream over RTSP. Host networking is required for
  # WebRTC ICE — Docker's NAT breaks UDP candidate gathering.
  mediamtx:
    # ffmpeg variant has Alpine + sh + wget. Required because MediaMTX's
    # runOnReady/runOnNotReady hooks are shell commands (calls Laravel via
    # wget), and the bare scratch image has no shell to execute them.
    image: bluenviron/mediamtx:1.10.0-ffmpeg
    container_name: gocast-mediamtx
    network_mode: host
    environment:
      # Where MediaMTX reaches the Laravel API for the auth + lifecycle
      # webhooks. host networking → "localhost" is the host loopback.
      # Prod publishes the api container on :80; dev override flips this
      # to :8000.
      INTERNAL_API_URL: ${MEDIAMTX_INTERNAL_API_URL:-http://localhost:80}
      # Shared secret for the lifecycle webhooks (whip-ready / whip-not-ready).
      # Sent as `X-Internal-Key` on every hook so the Laravel `internal`
      # middleware can drop unauthenticated callers — without this, anyone
      # who can reach the api can flip stations live/offline.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?required}
      # Overrides authHTTPAddress in mediamtx.yml. Dev override uses :8000.
      MTX_AUTHHTTPADDRESS: ${MEDIAMTX_INTERNAL_API_URL:-http://localhost:80}/api/internal/whip-auth
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--tries=1", "--timeout=3", "http://localhost:9997/v3/paths/list"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          # Grows with concurrent WebRTC sessions and any ffmpeg work the
          # runOnReady hooks trigger, so this one gets real headroom.
          memory: 1G
    restart: unless-stopped

  # ---------- Laravel API + Filament admin ----------
  # FrankenPHP serves HTTP/2 + HTTP/3 + PHP from one process. In prod, Caddy
  # underneath either negotiates Let's Encrypt directly (set SERVER_NAME) or
  # accepts the Cloudflare Origin Cert (mount Caddyfile.cloudflare via the
  # override file).
  api:
    build:
      context: ./api
      target: prod
    container_name: gocast-api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      # MySQL is on the host; this lets `DB_HOST=host.docker.internal` resolve.
      - "host.docker.internal:host-gateway"
    env_file:
      - ./api/.env
    environment:
      SERVER_NAME: ${SERVER_NAME:-:80}
      # Second vhost served by the same Caddy: terminates TLS for the
      # broadcaster ingest hostname and reverse-proxies WHIP signalling to
      # MediaMTX (plain HTTP on :8889), plus serves Liquidsoap's HLS output
      # off /var/gocast/hls. Browsers can't POST a WHIP offer from an HTTPS
      # page to an http:// endpoint, so this is what makes "go live" work in
      # production. See api/Caddyfile for the full rationale.
      WHIP_SERVER_NAME: ${WHIP_HOSTNAME:-stream.gocast.fm}
      DB_HOST: host.docker.internal
      DB_DATABASE: ${MYSQL_DATABASE:-gocast}
      DB_USERNAME: ${MYSQL_USER:-gocast}
      DB_PASSWORD: ${MYSQL_PASSWORD:?required}
      REDIS_HOST: redis
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?required}
      # Point the Docker CLI inside this container at the socket proxy
      # instead of the host daemon. The proxy only exposes the endpoints
      # LiquidsoapSupervisor needs (containers/networks/images) — so a
      # compromised api process can manage stations but can't mount the
      # host root, spawn privileged containers, or escape to root-on-host.
      DOCKER_HOST: tcp://docker-proxy:2375
      # Liquidsoap source/admin credentials — Laravel renders these into
      # per-station .liq files (output.icecast block). Must match the
      # icecast service's env or stations get 401 on SOURCE connect.
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?required}
      ICECAST_ADMIN_USER: ${ICECAST_ADMIN_USER:-admin}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?required}
      # Addresses rendered into each station's .liq, from that container's
      # point of view (see config/liquidsoap.php). Pinned here rather than
      # left to the config defaults because api/.env carries the values for
      # running artisan NATIVELY on the host — and env_file is read before
      # this block, so these win for the containerised path. Without that,
      # switching between native and compose workflows would silently write
      # the wrong host into every station's script.
      LIQUIDSOAP_ICECAST_HOST: icecast
      LIQUIDSOAP_ICECAST_PORT: 8000
      LIQUIDSOAP_API_URL: http://api
      LIQUIDSOAP_TELNET_RESOLVE: name
      ICECAST_INTERNAL_URL: http://icecast:8000
    volumes:
      - api_storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
      - ./infra/certs:/etc/caddy/certs:ro
      # Per-station data — the supervisor writes .liq files here, and the
      # paths are also bind-mounted into each Liquidsoap container.
      - /var/gocast:/var/gocast
    depends_on:
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          # opcache alone is configured for 256M in the prod target, on top of
          # per-request PHP memory across FrankenPHP's worker threads.
          memory: 1G
    restart: unless-stopped

  # ---------- Scheduler ----------
  # Runs everything declared in api/routes/console.php: the per-minute Icecast
  # listener-count poll, the nightly container reconcile, login-abuse
  # detection, the day-7 broadcaster nudge.
  #
  # `schedule:work` is the long-running form of `schedule:run` — it ticks once
  # a minute in the foreground, so it supervises like any other container
  # instead of needing a host crontab entry. Without this service every
  # Schedule::command() in the app is dead code (listener counts pin at 0).
  #
  # Deliberately a single replica: the schedule's withoutOverlapping locks are
  # per-process unless a shared cache store backs them, so a second scheduler
  # would double-fire jobs.
  scheduler:
    build:
      context: ./api
      target: prod
    container_name: gocast-scheduler
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./api/.env
    environment:
      DB_HOST: host.docker.internal
      DB_DATABASE: ${MYSQL_DATABASE:-gocast}
      DB_USERNAME: ${MYSQL_USER:-gocast}
      DB_PASSWORD: ${MYSQL_PASSWORD:?required}
      REDIS_HOST: redis
      # stations:reconcile shells out to `docker` to find orphaned per-station
      # containers, so it needs the same proxied daemon access as the api.
      DOCKER_HOST: tcp://docker-proxy:2375
      ICECAST_ADMIN_USER: ${ICECAST_ADMIN_USER:-admin}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?required}
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?required}
      # stations:relaunch re-renders .liq files, so the scheduler needs the
      # same container-perspective addresses as the api. Keep these in sync.
      LIQUIDSOAP_ICECAST_HOST: icecast
      LIQUIDSOAP_ICECAST_PORT: 8000
      LIQUIDSOAP_API_URL: http://api
      LIQUIDSOAP_TELNET_RESOLVE: name
      ICECAST_INTERNAL_URL: http://icecast:8000
    volumes:
      - api_storage:/app/storage
      # stations:reconcile / stations:relaunch write .liq files and playlist
      # dirs, same as the api container.
      - /var/gocast:/var/gocast
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      api:
        condition: service_started
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # ---------- Queue worker ----------
  # Same image as `api`, runs queue:work instead of the web server.
  queue:
    build:
      context: ./api
      target: prod
    container_name: gocast-queue
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./api/.env
    environment:
      DB_HOST: host.docker.internal
      DB_DATABASE: ${MYSQL_DATABASE:-gocast}
      DB_USERNAME: ${MYSQL_USER:-gocast}
      DB_PASSWORD: ${MYSQL_PASSWORD:?required}
      REDIS_HOST: redis
    volumes:
      - api_storage:/app/storage
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=60"]
    depends_on:
      api:
        condition: service_started
    # No healthcheck: `queue:monitor` always exits 0 (it only dispatches an
    # event past threshold), so it doesn't actually report worker liveness.
    # `queue:work` blocks in the foreground — if it crashes the container
    # exits and `restart: unless-stopped` brings it back, which is the
    # liveness signal we actually want.
    logging: *default-logging
    deploy:
      resources:
        limits:
          # Headroom over the api's ceiling is deliberate: jobs handle audio
          # uploads, and a job that blows this limit dies alone instead of
          # taking the web tier with it.
          memory: 768M
    restart: unless-stopped

  # ---------- Next.js client ----------
  # NEXT_PUBLIC_* values are inlined at build time — they MUST be build args.
  client:
    build:
      context: ./client
      target: prod
      args:
        NEXT_PUBLIC_API_URL: https://${API_HOSTNAME:-api.gocast.fm}/api
        NEXT_PUBLIC_APP_URL: https://${APP_HOSTNAME:-gocast.fm}
        NEXT_PUBLIC_ICECAST_URL: https://${ICECAST_HOSTNAME:-icecast.gocast.fm}
        NEXT_PUBLIC_WHIP_URL: https://${WHIP_HOSTNAME:-stream.gocast.fm}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    container_name: gocast-client
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--tries=1", "--timeout=3", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          # Prod runs the standalone build (`node server.js`), which is far
          # lighter than `next dev`. The dev override raises this — do not
          # copy this number into a development setup.
          memory: 1G
    restart: unless-stopped

volumes:
  redis_data:
  # Laravel's storage/ — uploads + framework cache. Backed up via backup.sh.
  api_storage:
  # Caddy's TLS state. Persisting is critical: Let's Encrypt rate-limits
  # 50 issuances/domain/week, ephemeral storage burns through that on
  # every restart.
  caddy_data:
  caddy_config:

networks:
  # Named network so per-station Liquidsoap containers (spawned outside
  # compose by LiquidsoapSupervisor) can join with `docker run --network
  # gocast-network` and resolve `icecast`, `redis`, etc. by service name.
  default:
    name: gocast-network
