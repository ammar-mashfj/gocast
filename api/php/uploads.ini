; Audio uploads for the AutoDJ library cap at 50 MB per file (validated in
; StoreTrackRequest), plus a per-station 100 MB total cap (TrackImporter).
; PHP's defaults (2M / 8M) reject these uploads before Laravel ever sees them.
;
; post_max_size is set ~10% above the per-station cap so a user can finish
; filling their library in one large drag-drop batch without splitting it.
; max_file_uploads matches the StoreTrackRequest 30-file batch limit.

upload_max_filesize = 60M
post_max_size       = 110M
max_file_uploads    = 30

; Long uploads on slow connections — give them 5 minutes before timing out.
max_input_time      = 300
max_execution_time  = 300

; Slightly bumped memory limit so getID3 + multipart parsing of a 50 MB
; FLAC doesn't OOM the request worker.
memory_limit        = 256M
