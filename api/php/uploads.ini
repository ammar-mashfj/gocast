; Audio uploads for the AutoDJ library cap at 300 MB per file (validated in
; StoreTrackRequest), plus a per-station 2 GB total cap (TrackImporter).
; PHP's defaults (2M / 8M) reject these uploads before Laravel ever sees them.
;
; post_max_size caps ONE multipart body, not the library. The client splits a
; drop into ~500 MB batches (see library/upload.ts `batchFiles`), so this only
; needs headroom over that — a per-station cap no longer fits in one request.
; max_file_uploads matches the StoreTrackRequest 30-file batch limit.

upload_max_filesize = 320M
post_max_size       = 640M
max_file_uploads    = 30

; A 500 MB batch over a 5 Mbit upstream is ~13 minutes. 5 minutes was sized
; for 100 MB batches and now cuts big drops off mid-flight.
max_input_time      = 900
max_execution_time  = 900

; Slightly bumped memory limit so getID3 + multipart parsing of a 300 MB
; FLAC doesn't OOM the request worker. Uploads themselves stream to temp
; files, so this does not scale with the body size — only tag reading does.
memory_limit        = 512M
