# Dev override — auto-loaded by `docker compose up`. Not used in prod
# (deploy.sh explicitly sets COMPOSE_FILE to bypass this).
#
# What this changes vs. the base file:
#   • Build target switched to `dev` (composer dev-deps, hot reload, etc.)
#   • Source code bind-mounted into containers for instant reload
#   • Dev ports exposed for direct access (mysql client, redis-cli, etc.)
#   • Plain HTTP on :8000 instead of :80/:443

services:
  redis:
    ports:
      - "6379:6379"

  # MediaMTX hits the dev API on port 8000 (mapped to api container's :80).
  # Prod uses :80 via the base compose; this just flips the host-side port.
  mediamtx:
    environment:
      INTERNAL_API_URL: http://localhost:8000
      MTX_AUTHHTTPADDRESS: http://localhost:8000/api/internal/whip-auth

  api:
    build:
      target: dev
    ports: !override
      - "8000:80"
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor
    environment:
      SERVER_NAME: ":80"
      # Pin the ingest vhost to the internal-CA default in dev. Without this
      # it inherits WHIP_HOSTNAME from the root .env and the dev container
      # starts asking Let's Encrypt for a cert on your real domain. Dev
      # broadcasters talk to MediaMTX directly on :8889 anyway (see the
      # client build args below), so this vhost is never routed to locally.
      WHIP_SERVER_NAME: whip.localhost

  queue:
    build:
      target: dev
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor

  scheduler:
    build:
      target: dev
    volumes:
      - ./api:/app
      - api_vendor:/app/vendor

  client:
    build:
      target: dev
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_ICECAST_URL: http://localhost:8888
        NEXT_PUBLIC_WHIP_URL: http://localhost:8889
    environment:
      # Server-side fetches from Next.js stay inside the Docker network.
      # Browser-side requests still use NEXT_PUBLIC_API_URL (baked at build).
      INTERNAL_API_URL: http://api/api
      INTERNAL_ICECAST_URL: http://icecast:8000
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
      # Keep Next.js's build cache out of the bind mount — otherwise every
      # .next write echoes back to the host filesystem, the watcher picks it
      # up, and dev pegs the CPU in a recompile-rewatch loop.
      - client_next_cache:/app/.next

volumes:
  api_vendor:
  client_node_modules:
  client_next_cache:
